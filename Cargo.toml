# Cargo.toml — workspace root.
#
# Phase 5 Step 5i (docs/ember2d-phase5-plan.md §5.5) split the single
# `ember2d` crate into a workspace:
#   ember2d-sim     math, color, world, components, level, save, scripting,
#                   command, scheduler, graph, event — no renderer, window,
#                   or input-device dependency anywhere in its tree.
#   ember2d         engine, renderer, input, mouse, gamepad, audio, play,
#                   project, camera, sim (orchestration; see that module's
#                   own doc comment for why it's here, not in ember2d-sim)
#                   → depends on ember2d-sim.
#   ember2d-editor  the level/script editor → depends on both.
#   ember2d-app     the thin bin crate (main.rs + app.rs's Editor<->Play
#                   orchestration) → depends on ember2d and ember2d-editor.
#
# This is a "virtual" workspace manifest — no package of its own here, just
# the member list and the profile settings below (which Cargo requires to
# live at the workspace root once there's more than one package).

[workspace]
resolver = "2"
members = [
    "ember2d-sim",
    "ember2d",
    "ember2d-editor",
    "ember2d-app",
]

# Dependencies compile at full optimization even in a `cargo run`/`cargo test`
# debug build; only these crates' own code stays unoptimized (fast
# incremental builds). Without this, `wgpu` (and its dependency tree —
# `wgpu-core`, `wgpu-hal`, `naga`) and `rhai`'s interpreter run 5-10x slower
# than they need to: both do a lot of per-frame CPU-side work (wgpu's
# resource/hazard tracking and command encoding; Rhai's AST walking on every
# `on_update`/`on_turn` call) that an unoptimized build makes
# disproportionately expensive, on top of whatever the game itself is doing
# — this is a standard, widely-recommended fix for any wgpu-based Rust
# project's debug performance, not something specific to this codebase.
# Found live: floor2 (docs/ember2d-phase5-plan.md Step 5f's follow-up) still
# ran at ~21 fps on capable hardware (RTX 2080, i7-9700K) even after fixing
# the redundant per-step `ScriptState` snapshot rebuilds — this is the
# actual dominant cost that fix couldn't touch.
[profile.dev.package."*"]
opt-level = 3

# `[profile.dev.package."*"]` above only ever applies to *dependencies* —
# Cargo deliberately never lets a package-name override reach a workspace's
# own member crates, so this project's own code (ScriptState snapshot
# construction, World iteration, apply_ctx's pending-queue draining —
# exactly the code the floor2 perf investigation traced the remaining cost
# to; benchmarking showed ZERO change from the override above, confirming
# rhai/wgpu weren't actually the bottleneck there) stayed at the default
# debug `opt-level = 0`: no inlining, no bounds-check elimination, nothing.
# `opt-level = 1` is the standard middle ground for Rust game dev (see e.g.
# Bevy's own recommended Cargo config): a large real-world speedup for
# exactly this kind of allocation/loop-heavy hot code, at a much smaller
# compile-time cost than full `--release` (opt-level 3 + LTO +
# codegen-units=1) — incremental `cargo run` builds of just the changed
# workspace member's own files stay fast. `[profile.dev]` at the workspace
# root applies to every member crate (ember2d-sim, ember2d, ember2d-editor,
# ember2d-app all count as "workspace-local," same as the single root crate
# did before Step 5i's split).
[profile.dev]
opt-level = 1
