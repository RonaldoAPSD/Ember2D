# ember2d-sim/Cargo.toml — the deterministic simulation core.
#
# No renderer, no window, no input-device crate anywhere in this list —
# that's the constraint Phase 5 Step 5i's workspace split exists to enforce
# (docs/ember2d-phase5-plan.md §5.5). `cargo build -p ember2d-sim` succeeding
# with a dependency tree this short is the actual proof.

[package]
name       = "ember2d-sim"
version    = "0.5.7-d"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/RonaldoAPSD/Ember2D"

[dependencies]
# serde: derives (De)Serialize on every sim-side data type — components,
# World, level/save data. `rc` (Step 8-1, docs/ember2d-master-plan.md
# §5.7): `World.tilemaps` holds each `Tilemap` behind an `Rc` so the
# per-step `WorldSnapshot` can share it with a refcount bump instead of
# copying 40,000 cells — and `World` must still serialize for saves. Not a
# new dependency, just serde's own opt-in impls for `Rc<T>` (it serializes
# the pointee; sharing isn't preserved across a save, and needn't be).
serde = { version = "1", features = ["derive", "rc"] }

# ron: the level (.level) and save-file format.
ron = "0.8"

# rhai: the scripting engine. Pure Rust, no window/GPU dependency of its own.
rhai = { version = "1", features = ["no_module", "no_closure", "serde"] }

# rand: level seeds (level.rs) and every script random_* call
# (scripting/engine.rs) — SmallRng only, no OS-entropy dependency at runtime
# (defect D3, docs/ember2d-refactor-plan.md).
rand = { version = "0.8", features = ["small_rng"] }
