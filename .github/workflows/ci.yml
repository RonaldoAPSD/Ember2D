# CI — Phase 5.5 Part 1 (docs/ember2d-phase5.5-plan.md).
#
# Matrix on windows-latest AND ubuntu-latest deliberately, not just the one
# OS this project is developed on: the whole reason for the refactor plan's
# §5.2 H1/H2 determinism work (docs/ember2d-refactor-plan.md) is cross-
# platform reproducibility for future netcode. Running the same tests on
# Linux while the only dev machine is Windows is close to free here — none
# of these tests touch a GPU, a window, or an audio device (ember2d-sim's
# whole point) — and it's the most direct way to catch an H1-class
# regression (a stray HashMap reintroduced somewhere) that could otherwise
# sit invisible on one OS for months.
#
# --lib plus explicitly named integration tests, not bare `cargo test` —
# matches this project's own documented convention
# (docs/ember2d-phase5-plan.md §5): a bare `cargo test` also tries to build
# a test binary for main.rs, which the primary dev machine's Application
# Control policy blocks. CI runners don't have that policy, but there's no
# reason to diverge from the project's own invocation, and it keeps this
# command copy-pasteable for a human running the same thing locally.
#
# Deliberately NOT run here: the "replay 5x as independent fresh processes"
# discipline documented in tests/replay.rs's own header and
# docs/ember2d-regression-checklist.md §15 — one run per OS per push is the
# right initial scope for this workflow. That 5x discipline stays a manual
# pre-merge gate for anyone touching sim ordering, deferred writes, or RNG.
# Also not run here: regenerating roguelike/*.level via
# `cargo run --example gen_roguelike` — that's a content-authoring step, not
# a build/test gate; the checked-in .level files are what
# roguelike_level_integrity already asserts against.

name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - run: cargo test --workspace --lib
      - run: cargo test --test persistent_on_start --test trigger_collider_layer --test roguelike_floor1 --test roguelike_combat --test roguelike_level_integrity --test save_load_globals --test replay --test external_commands --test turn_animation
