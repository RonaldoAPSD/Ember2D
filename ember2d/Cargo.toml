# ember2d/Cargo.toml — the engine crate: rendering, windowing, input
# devices, audio, and play-mode orchestration on top of `ember2d-sim`.

[package]
name       = "ember2d"
version    = "0.5.7-b"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/RonaldoAPSD/Ember2D"

[dependencies]
ember2d-sim = { path = "../ember2d-sim" }

# winit: opens a real OS window and provides an event loop.
# 7B-1 (docs/ember2d-master-plan.md §5.2): 0.29 -> 0.30, the release that
# replaced the closure-based `event_loop.run(...)` with the
# `ApplicationHandler` trait — see `engine.rs`'s own note on `pump_app_events`.
winit = { version = "0.30" }

# wgpu: cross-platform, safe, pure-rust graphics API.
# 7B-1: 0.19 -> 30 — wgpu ships a breaking release roughly every three
# months, so this is ~11 major versions, not a routine bump (R29, and the
# real reason this step exists before any theme work builds on top of the
# renderer). See `backend.rs`'s own notes at each call site this touched.
wgpu = "30"

# bytemuck: for casting vertex data to bytes for GPU upload.
bytemuck = { version = "1", features = ["derive"] }

# glam: fast linear algebra for 2D/3D math.
# 7B-1: 0.25 -> 0.33, collapsing the two `glam` versions Cargo.lock carried
# (0.25 direct, 0.29.3 pulled in transitively by a newer wgpu) into one.
glam = "0.33"

# pollster: for blocking on async WGPU calls.
pollster = "0.3"

# font8x8: an embedded 8×8-pixel bitmap font covering the ASCII range (0–127).
font8x8 = "0.2"

# image: for loading PNG/JPG textures.
# 7B-1: 0.24 -> 0.25.
image = "0.25"

# serde: (De)Serialize on this crate's own types that round-trip through
# RON (project.ron, mouse/gamepad button enums).
serde = { version = "1", features = ["derive"] }

# ron: the project (project.ron) file format.
ron = "0.8"

# rhai: `PlayState`/`Engine` carry `rhai::Dynamic` globals/persistent maps
# straight from the scripting engine (ember2d-sim), so this crate needs the
# type even though the interpreter itself lives in ember2d-sim.
rhai = { version = "1", features = ["no_module", "no_closure", "serde"] }

# kira: a game-focused audio library with first-class support for looping,
# fading, and pausing. Pure Rust — no C dependencies, builds on all platforms.
# "ogg" and "mp3" enable those decoder features via symphonia.
# 7B-1: 0.9 -> 0.12.
kira = { version = "0.12", features = ["ogg", "mp3"] }

# rand: this crate's own particle/camera-shake RNG (play.rs) — a separate
# deterministic stream from ember2d-sim's script RNG (see
# PLAYSTATE_RNG_SEED_OFFSET in play.rs).
# 7B-1 (docs/ember2d-master-plan.md §5.2): deliberately NOT bumped past 0.8
# alongside everything else here. 0.9 changes SmallRng's own seeding
# algorithm, which would silently change every level's RNG stream —
# ember2d-sim's `Simulation::new(seed, ...)` would produce different loot/
# AI/particle sequences for the exact same seed, desyncing every existing
# save fixture and any recorded replay. Migrating is a Phase 11 decision
# that comes with a replay-fixture regeneration, not a side effect of a
# renderer dependency bump.
rand = { version = "0.8", features = ["small_rng"] }

# gilrs: gamepad input support.
# 7B-1: 0.10 -> 0.11.
gilrs = "0.11"

# fontdue: pure-rust TTF/OTF rasterizer for Phase 7 Part 2's `TtfFont`
# (docs/ember2d-phase7-plan.md) — additive per that phase's guardrail (§0.6).
fontdue = "0.9"

# rfd: native error dialog for the two fatal-GPU-init paths in
# renderer/mod.rs (R29, 7B-1, docs/ember2d-master-plan.md §5.2) — a failed
# `request_adapter`/`request_device` used to be a bare `.expect()` panic
# with no message a user launching the exe directly (no console) would
# ever see. Already an `ember2d-editor` dependency; same version.
rfd = "0.17.2"
