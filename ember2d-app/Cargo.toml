# ember2d-app/Cargo.toml — the thin bin crate: `main.rs` plus `app.rs`'s
# Editor <-> Play orchestration.
#
# `app.rs` is here, not in the `ember2d` library crate, because it's the one
# place that needs BOTH `ember2d`'s `PlayState`/`Engine` AND
# `ember2d-editor`'s `EditorState` — `ember2d` can't depend on
# `ember2d-editor` (which itself depends on `ember2d`) without the
# workspace cycling. See `ember2d`'s own `lib.rs` for the full reasoning
# (Phase 5 Step 5i, docs/ember2d-phase5-plan.md §5.5).
#
# `[[bin]] name = "ember2d"` keeps `cargo run` producing the same
# `target/debug/ember2d.exe` this project's docs (CLAUDE.md) already
# document, even though the package itself is named `ember2d-app` (that
# package name was already taken by the library crate).

[package]
name    = "ember2d-app"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "ember2d"
path = "src/main.rs"

[dependencies]
ember2d        = { path = "../ember2d" }
ember2d-editor = { path = "../ember2d-editor" }

# rhai: `AppState::persistent` carries `rhai::Dynamic` values straight from
# the scripting engine (ember2d-sim, via ember2d's re-export).
rhai = { version = "1", features = ["no_module", "no_closure", "serde"] }
