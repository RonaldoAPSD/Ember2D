# ember2d-editor/Cargo.toml — the level/script editor.
#
# Depends on both halves of the Step 5i split: `ember2d-sim` for what a
# level actually contains (World, components, level/save data), `ember2d`
# for the renderer/input/PlayState it needs to draw itself and preview a
# level (F5).

[package]
name       = "ember2d-editor"
version    = "0.5.7-d"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/RonaldoAPSD/Ember2D"

[dependencies]
ember2d-sim = { path = "../ember2d-sim" }
ember2d     = { path = "../ember2d" }

# serde: (De)Serialize on the palette file format.
serde = { version = "1", features = ["derive"] }

# ron: the tile-palette (.ron) file format.
ron = "0.8"

# rhai: `GameState::on_start`'s signature carries a `rhai::Dynamic`
# persistent map (same reason `ember2d` itself needs the type — see that
# crate's own Cargo.toml).
rhai = { version = "1", features = ["no_module", "no_closure", "serde"] }

# rfd: native "Open File"/"Open Folder" dialogs for project/level browsing.
rfd = "0.17.2"

# rand: a fresh level's seed (grid.rs, `LevelGrid::new`) — a real, separate
# `rand::random()` call, not shared with any sim-side seeded stream (a
# level generator must NOT do this — its output has to be reproducible —
# but an interactively-created level should).
rand = { version = "0.8", features = ["small_rng"] }

# arboard: best-effort OS clipboard sync for the script editor's cut/copy
# (7C-8, master plan §5.3) — `EditorState::script_clipboard` (a plain
# `String`) is the real source of truth a paste reads from, precisely so
# nothing here depends on a live display/clipboard server existing; CI
# runs both target OSes headless. `Clipboard::new()` can fail with no
# display (Linux/X11) even though the crate itself builds fine everywhere
# — every call site treats that as "no OS clipboard available" and moves
# on rather than erroring the edit.
arboard = "3"

[dev-dependencies]
# Step 8-2: `tests/editor_importer.rs` writes a small PNG sprite sheet to
# import. Not a new crate in the tree — `ember2d` already depends on the
# same `image` 0.25 for `Texture::load`; this only makes it nameable from
# this crate's tests.
image = "0.25"
