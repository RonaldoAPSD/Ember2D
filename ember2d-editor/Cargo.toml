# ember2d-editor/Cargo.toml — the level/script editor.
#
# Depends on both halves of the Step 5i split: `ember2d-sim` for what a
# level actually contains (World, components, level/save data), `ember2d`
# for the renderer/input/PlayState it needs to draw itself and preview a
# level (F5).

[package]
name    = "ember2d-editor"
version = "0.5.0"
edition = "2021"

[dependencies]
ember2d-sim = { path = "../ember2d-sim" }
ember2d     = { path = "../ember2d" }

# serde: (De)Serialize on the palette file format.
serde = { version = "1", features = ["derive"] }

# ron: the tile-palette (.ron) file format.
ron = "0.8"

# rhai: `GameState::on_start`'s signature carries a `rhai::Dynamic`
# persistent map (same reason `ember2d` itself needs the type — see that
# crate's own Cargo.toml).
rhai = { version = "1", features = ["no_module", "no_closure", "serde"] }

# rfd: native "Open File"/"Open Folder" dialogs for project/level browsing.
rfd = "0.17.2"

# rand: a fresh level's seed (grid.rs, `LevelGrid::new`) — a real, separate
# `rand::random()` call, not shared with any sim-side seeded stream (see
# examples/gen_roguelike.rs's own header comment on why a generator must
# NOT do this, but an interactively-created level should).
rand = { version = "0.8", features = ["small_rng"] }
